# Rebuilds the CRA index monthly from CRA's own pages and writes only what changed to the Cloudflare D1
# database the Worker reads. Needs repository secrets CLOUDFLARE_API_TOKEN (D1 edit) and CLOUDFLARE_ACCOUNT_ID.
name: Refresh CRA index
on:
  schedule:
    - cron: '17 9 1 * *'   # 09:17 UTC on the 1st of each month
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cra-index
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          pip install -e .
          npm ci --prefix worker
      - name: Crawl CRA (about 150 publications, robots-aware, one request a second)
        run: python -m canadian_tax_mcp.ingest --db data/cra.sqlite3 --max-pages 150
      - name: Find what changed
        working-directory: worker
        run: |
          npx wrangler d1 execute acquill-tax-cra --remote --json --command "SELECT id, hash FROM documents" > ../known.json
          python ../scripts/export_d1.py --db ../data/cra.sqlite3 --known ../known.json --out build/cra.sql
      - name: Write changes to D1
        working-directory: worker
        run: npx wrangler d1 execute acquill-tax-cra --remote --file build/cra.sql --yes
      - name: Check the live service
        run: curl -fsS https://tax.acquill.com/health
