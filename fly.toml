# Acquill Canadian Tax on Fly.io (same provider as acquill.com). Not yet launched: see DEPLOY-FLY.md.
app = "acquill-tax"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  PUBLIC_HOST = "tax.acquill.com"
  PUBLIC_URL = "https://tax.acquill.com"
  TAX_DB = "/app/data/cra.sqlite3"
  # Rebuild the CRA index when empty (first start) or older than this many days.
  INDEX_REFRESH_DAYS = "30"
  # SUPPORT_EMAIL and OPENAI_APPS_CHALLENGE are set with `fly secrets set` (see DEPLOY-FLY.md).

[[mounts]]
  source = "tax_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
